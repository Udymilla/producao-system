{% extends "base.html" %}
{% block title %}Responder Ficha{% endblock %}
{% block page_title %}Responder Ficha{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow">

  <form method="post" action="/responder_ficha">

    <input type="hidden" name="ficha_id" value="{{ ficha.id }}">

    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium">Número da Ficha</label>
        <input type="text" value="{{ ficha.numero_ficha }}" readonly
               class="w-full bg-gray-100 border rounded px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium">Quantidade Total</label>
        <input type="text" value="{{ ficha.quantidade_total }}" readonly
               class="w-full bg-gray-100 border rounded px-3 py-2">
      </div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium">Modelo</label>
      <input type="text" value="{{ ficha.modelo }}" readonly
             class="w-full bg-gray-100 border rounded px-3 py-2">
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium">Operador</label>
        <input type="text" name="operador" required
               class="w-full border rounded px-3 py-2">
      </div>

      <div>
        <label class="block text-sm font-medium">Função</label>
        <select name="funcao" required>
         <option value="">Selecione...</option>
          {% for f in funcoes %}
         <option value="{{ f.funcao }}">{{ f.funcao }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <button type="submit"
            class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
      ✅ Lançar Produção
    </button>
  </form>

</div>
{% endblock %}
