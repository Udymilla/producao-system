{% extends "base.html" %}
{% block title %}Responder Ficha{% endblock %}
{% block page_title %}Responder Ficha{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow">

  <form method="post" action="/responder_ficha">
    <input type="hidden" name="ficha_id" value="{{ ficha.id }}">

    <!-- Número / Quantidade -->
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="font-bold block mb-1">Número da Ficha</label>
        <input value="{{ ficha.numero_ficha }}" readonly class="input">
      </div>

      <div>
        <label class="font-bold block mb-1">Quantidade Total</label>
        <input value="{{ ficha.quantidade_total }}" readonly class="input">
      </div>
    </div>

    <!-- Modelo -->
    <div class="mb-4">
      <label class="font-bold block mb-1">Modelo</label>
      <input value="{{ formulario.nome_modelo }}" readonly class="input">
    </div>

    {% if formulario.url_imagem %}
    <div class="text-center mb-4">
      <img src="{{ formulario.url_imagem }}" class="mx-auto rounded max-w-xs">
    </div>
    {% endif %}

    <!-- CA / Cor do Viés -->
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="font-bold block mb-1">CA</label>
        <input value="{{ formulario.ca or '-' }}" readonly class="input">
      </div>

      <div>
        <label class="font-bold block mb-1">Cor do Viés</label>
        <input value="{{ formulario.cor_vies or '-' }}" readonly class="input">
      </div>
    </div>

    <!-- Operador / Função -->
    <div class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <label class="font-bold block mb-1">Operador</label>
        <input name="operador" required class="input">
      </div>

      <div>
  <label class="font-bold block mb-1">Função</label>

  <select name="funcao_id" required class="input">
  <option value="">Selecione…</option>
  {% for f in funcoes %}
    <option value="{{ f.id }}">{{ f.nome }}</option>
  {% endfor %}
</select>
</div>
    </div>

    <button class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-semibold">
      ✅ Lançar Produção
    </button>

  </form>
</div>
{% endblock %}
