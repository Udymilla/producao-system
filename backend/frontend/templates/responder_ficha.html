{% extends "base.html" %}
{% block title %}Responder Ficha{% endblock %}
{% block page_title %}Responder Ficha{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow">

  <form method="post" action="/responder_ficha">
    <input type="hidden" name="ficha_id" value="{{ ficha.id }}">

    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label>Número da Ficha</label>
        <input value="{{ ficha.numero_ficha }}" readonly class="input">
      </div>
      <div>
        <label>Quantidade Total</label>
        <input value="{{ ficha.quantidade_total }}" readonly class="input">
      </div>
    </div>

    <label>Modelo</label>
    <input value="{{ formulario.nome_modelo }}" readonly class="input mb-3">

    {% if formulario.url_imagem %}
    <div class="text-center mb-4">
      <img src="{{ formulario.url_imagem }}" class="mx-auto rounded max-w-xs">
    </div>
    {% endif %}

    <label>Cor do Viés</label>
    <input type="text"
       value="{{ ficha.formulario.cor_vies or '' }}"
       readonly>

    <label>CA</label>
    <input type="text"
       value="{{ ficha.formulario.ca or '' }}"
       readonly>


    <div class="grid grid-cols-2 gap-4">
      <div>
        <label>Operador</label>
        <input name="operador" required class="input">
      </div>

      <div>
        <label>Função</label>
        <select name="funcao" required class="input">
          <option value="">Selecione…</option>
          {% for f in funcoes %}
          <option value="{{ f.funcao }}">
            {{ f.funcao }}{% if f.tamanho %} - {{ f.tamanho }}{% endif %}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <button class="w-full bg-green-600 text-white py-2 rounded">
      ✅ Lançar Produção
    </button>
  </form>
</div>
{% endblock %}
