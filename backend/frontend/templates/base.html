<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Sistema de Produção Dadalto{% endblock %}</title>
  <link rel="icon" href="/static/favicon.png" />
  <link href="/static/css/output.css" rel="stylesheet" />
</head>

<body class="bg-gray-100 text-gray-800">

  <!-- HEADER -->
  <header class="bg-blue-700 text-white shadow-md">
    <div class="container mx-auto flex justify-between items-center py-3 px-6">
      <h1 class="text-xl font-bold tracking-wide">Sistema de Produção Dadalto</h1>
      <nav class="space-x-4">
        <a href="/dashboard" class="hover:text-blue-200 transition">⬅ Voltar</a>
        <a href="/logout" class="text-sm bg-red-500 px-3 py-1 rounded hover:bg-red-600 transition">Sair</a>
      </nav>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main class="container mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="text-center text-sm text-gray-500 py-4 border-t">
    &copy; {{ 2025 }} Sistema Dadalto. Todos os direitos reservados.
  </footer>

</body>
</html>
