<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Sistema de Produção Dadalto{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', path='img/favicon.png') }}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- ===== Cabeçalho Azul ===== -->
  <header class="bg-blue-800 text-white shadow-md">
    <div class="container mx-auto flex justify-between items-center px-6 py-4">

      <!-- Título da Página -->
      <h1 class="text-2xl font-bold tracking-wide">
        {% block page_title %}{% endblock %}
      </h1>

      <!-- Botões do Cabeçalho -->
      <div class="flex items-center gap-2">
        {% block header_extra %}{% endblock %}
        {% if back_url %}
        <a href="{{ back_url }}"
           class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-white transition">
          ⬅ Voltar
        </a>
        {% endif %}
      </div>
    </div>
  </header>

  <!-- ===== Corpo Principal ===== -->
  <main class="flex-1 container mx-auto px-6 py-8">
    {% block content %}
    {% endblock %}
  </main>

  <!-- ===== Rodapé ===== -->
  <footer class="bg-gray-100 py-4 text-center text-sm text-gray-500 border-t">
    © {{ now().year }} Sistema de Produção Dadalto — Todos os direitos reservados.
  </footer>

</body>
</html>
