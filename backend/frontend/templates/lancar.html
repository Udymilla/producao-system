{% extends "base.html" %}
{% block title %}Lançar Produção{% endblock %}
{% block page_title %}Lançar Ficha de Produção{% endblock %}
{% set back_url = '/dashboard' %}

{% block content %}
<div class="flex justify-center mt-10">
  <form action="/lancar" method="post"
        class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">

    <h2 class="text-2xl font-semibold text-gray-700 text-center mb-6">
      Registrar Produção
    </h2>

    <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-1">Operador:</label>
      <input type="text" name="operador" required
             class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-1">Modelo:</label>
      <select name="modelo" class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
        {% for m in modelos %}
          <option value="{{ m }}">{{ m }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-1">Função:</label>
      <select name="funcao" class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
          <option>AVENTAL BARBEIRO</option>
          <option>AVENTAL DE 1 RASPA</option>
          <option>AVENTAL DE 1 VAQUETA</option>
          <option>AVENTAL DE 1,20</option>
          <option>BLUSÃO ESPECIAL</option>
          <option>BLUSÃO DE RASPA</option>
          <option>BLUSÃO VAQ</option>
          <option>CALÇA RASPA</option>
          <option>COBERTURA P</option>
          <option>COBERTURA M</option>
          <option>COBERTURA G</option>
          <option>COBERTURA VERMELHA</option>
          <option>ARGONISTA FORCHETA P</option>
          <option>ARGONISTA FORCHETA M</option>
          <option>LUVA COMUM P15 C REFORÇO EXTERNO</option>
          <option>LUVA COMUM P20</option>
          <option>LUVA COMUM P7</option>
          <option>LUVA COMUM P7 C REFORÇO EXTERNO</option>
          <option>LUVA COMUM WURTH</option>
          <option>LUVA DE FORCHETA P</option>
          <option>LUVA DE FORCHETA M</option>
          <option>LUVA DE FORCHETA G</option>
          <option>LUVA DE VAQUETA OVO M</option>
          <option>LUVA DE VAQUETA OVO G</option>
          <option>LUVA DE VAQUETA OVO GG</option>
          <option>LUVA MÃO DE GATO</option>
          <option>LUVA DE RASPA PT</option>
          <option>LUVA DE RASPA VAN</option>
          <option>LUVA REVESTIDA DUPLA</option>
          <option>LUVA REVESTIDA GUIDO</option>
          <option>LUVA REVESTIDA WURTH</option>
          <option>LUVA VAQUETA MISTA CURTA</option>
          <option>LUVA DE VAQUETA MISTA LONGA P15</option>
          <option>LUVA DE VAQUETA MISTA LONGA P20</option>
          <option>LUVA VI FORCHETA GG</option>
          <option>MANGOTE INTEIRO</option>
          <option>MANGOTE DE EMENDA</option>
          <option>PERNEIRA DE EMENDA</option>
          <option>PERNEIRA DE FIVELA</option>
          <option>PERNEIRA DE VELCRO</option>
      </select>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-gray-700 font-medium mb-1">Quantidade por Ficha:</label>
        <input type="number" name="quantidade" min="50" value="50"
               class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-1">Qtd. de Fichas:</label>
        <input type="number" name="qtd_fichas" min="1" value="1"
               class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 font-medium mb-1">Número Inicial:</label>
      <input type="number" name="numero_inicial" 
             class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
    </div>

    <button type="submit"
            class="w-full bg-blue-700 text-white py-2 rounded-lg font-semibold hover:bg-blue-800 transition">
      💾 Lançar Produção
    </button>
  </form>
</div>
{% endblock %}
