{% extends "base.html" %}

{% block title %}Consultar Fichas{% endblock %}
{% block page_title %}Consulta de Fichas{% endblock %}
{% set back_url = '/dashboard' %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6">

  <!-- FILTRO -->
  <div class="flex flex-col sm:flex-row gap-4 mb-6">
    <input
      id="filtro"
      class="flex-1 border px-3 py-2 rounded"
      placeholder="Buscar por número da ficha ou modelo">

    <button
      id="pesquisar"
      type="button"
      class="bg-blue-600 text-white px-4 py-2 rounded">
      🔍 Pesquisar
    </button>
  </div>

  <!-- MENSAGEM -->
  <div
    id="mensagem"
    class="hidden mb-4 p-4 rounded text-center bg-yellow-100 text-yellow-800">
  </div>

  <!-- TABELA -->
  <div class="overflow-x-auto">
    <table class="w-full border notranslate">
      <thead class="bg-blue-600 text-white notranslate">
  <tr>
    <th class="p-2 text-left">Ficha</th>
    <th class="p-2 text-left">Modelo</th>
    <th class="p-2 text-center">Qtd Ficha</th>
    <th class="p-2 text-left">Operador</th>
    <th class="p-2 text-left">Função</th>
    <th class="p-2 text-center">Status</th>
  </tr>
</thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>

</div>

<script>
document.getElementById("pesquisar").addEventListener("click", async () => {

  const filtro = document.getElementById("filtro").value.trim();
  const mensagem = document.getElementById("mensagem");
  const tbody = document.getElementById("tabela");

  mensagem.classList.add("hidden");
  tbody.innerHTML = "";

  if (!filtro) {
    mensagem.textContent = "Informe um número de ficha ou modelo.";
    mensagem.classList.remove("hidden");
    return;
  }

  const formData = new FormData();

  if (!isNaN(filtro)) {
    formData.append("numero_ficha", filtro);
  } else {
    formData.append("modelo", filtro);
  }

  const resp = await fetch("/consultar_fichas_dados", {
    method: "POST",
    body: formData,
    credentials: "same-origin"
  });

  if (!resp.ok) {
    mensagem.textContent = "Erro ao consultar fichas.";
    mensagem.classList.remove("hidden");
    return;
  }

  const data = await resp.json();

  if (!data.dados || data.dados.length === 0) {
    mensagem.textContent = "Nenhuma ficha encontrada.";
    mensagem.classList.remove("hidden");
    return;
  }

tbody.innerHTML = data.dados.map(d => `
  <tr class="border-b hover:bg-gray-100">
    <td class="p-2 text-left">${d.numero_ficha}</td>
    <td class="p-2 text-left">${d.modelo}</td>
    <td class="p-2 text-center">${d.quantidade_ficha}</td>
    <td class="p-2 text-left">${d.operador}</td>
    <td class="p-2 text-left">${d.funcao}</td>
    <td class="p-2 text-center font-semibold text-green-600">
      ${d.status}
    </td>
  </tr>
`).join("");
});
</script>

{% endblock %}
