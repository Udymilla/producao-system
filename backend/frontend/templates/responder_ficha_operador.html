{% extends "base.html" %}
{% block content %}
<style>
  :root {
    --primary: #0d6efd;
    --bg-light: #ffffff;
    --text-light: #212529;
    --card-light: #f8f9fa;
    --border-light: #dee2e6;

    --bg-dark: #121212;
    --text-dark: #f5f5f5;
    --card-dark: #1c1c1c;
    --border-dark: #2b2b2b;
  }

  body { background-color: var(--bg-light); color: var(--text-light); transition: background-color .3s, color .3s; }
  @media (prefers-color-scheme: dark) {
    body { background-color: var(--bg-dark); color: var(--text-dark); }
  }

  .ficha-container {
    max-width: 640px; margin: 60px auto; background-color: var(--card-light); color: var(--text-light);
    border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.08); padding: 40px 45px; transition: background-color .3s, color .3s;
  }
  @media (prefers-color-scheme: dark) {
    .ficha-container { background-color: var(--card-dark); color: var(--text-dark); box-shadow: 0 0 10px rgba(255,255,255,.06); }
  }

  .ficha-container h2 { text-align: center; font-weight: 700; margin-bottom: 25px; }

  .ficha-dados {
    background: var(--card-light); border: 1px solid var(--border-light); border-radius: 10px; padding: 16px 20px; margin-bottom: 25px;
  }
  @media (prefers-color-scheme: dark) {
    .ficha-dados { background: var(--card-dark); border-color: var(--border-dark); }
  }

  label { display: block; font-weight: 600; margin-top: 15px; margin-bottom: 5px; }
  input[type="text"], input[type="number"], select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-light);
    background-color: var(--bg-light); color: var(--text-light); transition: all .3s;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  @media (prefers-color-scheme: dark) {
    input[type="text"], input[type="number"], select { background-color: var(--card-dark); color: var(--text-dark); border-color: var(--border-dark); }
    input:focus, select:focus { border-color: #66aaff; }
  }

  button {
    width: 100%; background-color: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600;
    padding: 12px; margin-top: 25px; font-size: 16px; transition: background-color .3s;
  }
  button:hover { background-color: #0b5ed7; cursor: pointer; }
</style>

<div class="ficha-container">
  <h2>Ficha {{ ficha.numero_ficha }}</h2>

  <!-- IMAGEM DO MODELO (com fallback) -->
  <div class="flex flex-col items-center justify-center mb-6">
    {% if url_imagem %}
      <img src="{{ url_imagem }}"
           alt="Imagem do Modelo"
           class="h-56 w-auto object-contain border border-gray-300 rounded-lg shadow-md mb-2 bg-white p-2">
    {% else %}
      <div class="flex flex-col items-center justify-center h-56 w-64 border border-dashed border-gray-400 rounded-lg">
        <p class="text-gray-500 text-sm">Imagem não cadastrada para este modelo.</p>
      </div>
    {% endif %}
  </div>

  <div class="ficha-dados">
    <p><b>Modelo:</b> {{ ficha.modelo }}</p>
    <p><b>Quantidade total:</b> {{ ficha.quantidade_total }}</p>
    <p><b>Função atual:</b> {{ ficha.funcao }}</p>
  </div>

  <form action="/responder_ficha" method="post">
    <!-- Se o endpoint espera 'token', mantenha 'name="token"'. Se espera 'token_qr', troque aqui. -->
    <input type="hidden" name="token" value="{{ token }}">

    <label for="operador">Nome do operador:</label>
    <input type="text" id="operador" name="operador" value="{{ operador }}" required>

    <label for="funcao">Selecione sua função:</label>
    <select id="funcao" name="funcao" required>
      {% for f in funcoes %}
        <option value="{{ f }}">{{ f }}</option>
      {% endfor %}
    </select>

    <label for="quantidade">Quantidade produzida:</label>
    <input type="number" id="quantidade" name="quantidade" value="{{ ficha.quantidade_total }}" required>

    <button type="submit">Registrar Produção</button>
  </form>
</div>
{% endblock %}
