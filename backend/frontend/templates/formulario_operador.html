{% extends "base.html" %}

{% block title %}Formulário do Operador{% endblock %}

{% block content %}
<div class="flex justify-center items-center">
  <div class="bg-white shadow-lg rounded-2xl w-full max-w-2xl p-8 border border-gray-200 relative">

    <!-- BOTÃO VOLTAR -->
    <a href="/dashboard" 
       class="absolute top-4 left-4 text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
      ⬅ Voltar
    </a>

    <h1 class="text-2xl font-bold text-center text-blue-600 mb-8">Formulário de Produção</h1>

    <form method="POST" action="/formulario_operador" class="space-y-6">

      <div>
        <label for="operador" class="block text-sm font-medium text-gray-700 mb-1">Operador:</label>
        <input type="text" id="operador" name="operador" placeholder="Digite seu nome"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2" required />
      </div>

      <div>
        <label for="modelo" class="block text-sm font-medium text-gray-700 mb-1">Modelo:</label>
        <select id="modelo" name="modelo"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2" required>
          <option value="">Selecione um modelo</option>
          {% for m in modelos %}
            <option value="{{ m.modelo }}">{{ m.modelo }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="funcao" class="block text-sm font-medium text-gray-700 mb-1">Função:</label>
        <input type="text" id="funcao" name="funcao" placeholder="Ex: Costura / Corte"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2" required />
      </div>

      <div>
        <label for="tamanho" class="block text-sm font-medium text-gray-700 mb-1">Tamanho:</label>
        <select id="tamanho" name="tamanho"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2" required>
          <option value="">Selecione</option>
          {% for t in ["PP", "P", "M", "G", "GG", "XG", "XG2"] %}
            <option value="{{ t }}">{{ t }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="quantidade" class="block text-sm font-medium text-gray-700 mb-1">Quantidade Produzida:</label>
        <input type="number" id="quantidade" name="quantidade" placeholder="Ex: 50"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2" min="1" required />
      </div>

      <div class="pt-4">
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-sm transition">
          Enviar
        </button>
      </div>

    </form>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const modeloSelect = document.getElementById("modelo");
  const funcaoInput = document.getElementById("funcao");
  modeloSelect.addEventListener("change", async () => {
    const modelo = modeloSelect.value;
    if (!modelo) return;
    try {
      const r = await fetch(`/api/funcao_por_modelo?modelo=${encodeURIComponent(modelo)}`);
      const data = await r.json();
      funcaoInput.value = data.funcao || "";
    } catch (e) { console.error(e); }
  });
});
</script>
{% endblock %}
