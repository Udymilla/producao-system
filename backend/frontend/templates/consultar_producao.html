{% extends "base.html" %}
{% block title %}Consulta de Produção{% endblock %}
{% block page_title %}Consulta de Produção{% endblock %}
{% set back_url = '/dashboard' %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6">

  <!-- Filtro -->
  <div class="grid md:grid-cols-4 gap-4 mb-6">
    <div>
      <label class="block text-sm font-medium">Operador</label>
      <input type="text" id="operador"
             class="w-full border rounded px-3 py-2"
             placeholder="Ex: Udymilla">
    </div>

    <div>
      <label class="block text-sm font-medium">Data Inicial</label>
      <input type="date" id="data_inicio"
             class="w-full border rounded px-3 py-2">
    </div>

    <div>
      <label class="block text-sm font-medium">Data Final</label>
      <input type="date" id="data_fim"
             class="w-full border rounded px-3 py-2">
    </div>

    <div class="flex items-end">
      <button id="pesquisar"
              class="bg-blue-600 text-white px-4 py-2 rounded">
        🔍 Pesquisar
      </button>
    </div>
  </div>

  <!-- Mensagem -->
  <div id="mensagem" class="hidden mb-4 p-4 rounded text-center"></div>

  <!-- Resultados -->
  <div id="resultado" class="hidden">
    <table class="w-full border">
      <thead class="bg-blue-600 text-white">
        <tr>
          <th class="p-2">Modelo</th>
          <th class="p-2">Total Peças</th>
        </tr>
      </thead>
      <tbody id="tabelaResultados"></tbody>
    </table>

    <canvas id="graficoProducao" class="mt-6"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const btnPesquisar = document.getElementById("pesquisar");
  const tabelaResultados = document.getElementById("tabelaResultados");
  const graficoCanvas = document.getElementById("graficoProducao");
  const mensagem = document.getElementById("mensagem");
  const resultado = document.getElementById("resultado");

  let grafico = null;

  btnPesquisar.addEventListener("click", async () => {
    const operador = document.getElementById("operador").value.trim();
    const data_inicial = document.getElementById("data_inicio").value;
    const data_final = document.getElementById("data_fim").value;

    if (!operador) {
      mensagem.textContent = "Informe o operador.";
      mensagem.className = "mb-4 p-4 bg-yellow-100 text-yellow-800";
      mensagem.classList.remove("hidden");
      return;
    }

    const formData = new FormData();
    formData.append("operador", operador);
    formData.append("data_inicial", data_inicial);
    formData.append("data_final", data_final);

    const resp = await fetch("/consultar_producao_dados", {
      method: "POST",
      body: formData
    });

    const data = await resp.json();

    mensagem.classList.add("hidden");
    resultado.classList.add("hidden");

    if (data.erro) {
      mensagem.textContent = "Nenhum resultado encontrado.";
      mensagem.className = "mb-4 p-4 bg-yellow-100 text-yellow-800";
      mensagem.classList.remove("hidden");
      return;
    }

    resultado.classList.remove("hidden");

    tabelaResultados.innerHTML = data.modelos.map((m, i) => `
      <tr>
        <td class="p-2">${m}</td>
        <td class="p-2">${data.quantidades[i]}</td>
      </tr>
    `).join("");

    if (grafico) grafico.destroy();

    grafico = new Chart(graficoCanvas, {
      type: "bar",
      data: {
        labels: data.modelos,
        datasets: [{
          data: data.quantidades,
          backgroundColor: "#2563eb"
        }]
      },
      options: {
        plugins: { legend: { display: false } }
      }
    });
  });
});
</script>
{% endblock %}
