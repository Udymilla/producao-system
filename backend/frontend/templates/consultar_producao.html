{% extends "base.html" %}
{% block title %}Consulta de Produção{% endblock %}
{% block page_title %}Consulta de Produção{% endblock %}
{% set back_url = '/dashboard' %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6">

  <!-- FILTRO -->
<div class="bg-gray-50 rounded-lg p-6 mb-6">

  <div class="grid md:grid-cols-4 gap-6 items-end">

    <!-- OPERADOR -->
    <div>
      <label class="block text-sm font-medium mb-1">
        Operador
      </label>
      <select id="usuario_id"
              class="w-full h-11 border border-gray-300 rounded-md px-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <option value="">Selecione o operador</option>
        {% for u in usuarios %}
          <option value="{{ u.id }}">{{ u.nome }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- DATA INICIAL -->
    <div>
      <label class="block text-sm font-medium mb-1">
        Data Inicial
      </label>
      <input type="date"
             id="data_inicio"
             class="w-full h-11 border border-gray-300 rounded-md px-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- DATA FINAL -->
    <div>
      <label class="block text-sm font-medium mb-1">
        Data Final
      </label>
      <input type="date"
             id="data_fim"
             class="w-full h-11 border border-gray-300 rounded-md px-3 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- BOTÃO -->
    <div>
      <button id="pesquisar"
              type="button"
              class="w-full h-11 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md transition">
        🔍 Pesquisar
      </button>
    </div>

  </div>

</div>

  <form method="get" action="/consultar_producao/pdf" class="inline">
  <input type="hidden" name="operador" value="{{ operador }}">
  <input type="hidden" name="data_inicial" value="{{ data_inicial }}">
  <input type="hidden" name="data_final" value="{{ data_final }}">

  <button
    type="submit"
    class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded ml-2"
  >
    📄 Gerar PDF
  </button>
</form>


  <!-- MENSAGEM -->
  <div id="mensagem" class="hidden mb-4 p-4 rounded text-center"></div>

  <!-- RESULTADO -->
  <div id="resultado" class="hidden">

    <!-- TABELA -->
    <table class="w-full border">
      <thead class="bg-blue-600 text-white">
        <tr>
          <th class="p-2">Ficha</th>
          <th class="p-2">Modelo</th>
          <th class="p-2">Função</th>
          <th class="p-2">Data</th>
          <th class="p-2">Total Peças</th>
        </tr>
      </thead>
      <tbody id="tabelaResultados"></tbody>
    </table>

    <!-- GRÁFICO -->
    <div class="mt-6">
      <canvas id="graficoProducao" style="height:300px"></canvas>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const btnPesquisar = document.getElementById("pesquisar");
  const tabelaResultados = document.getElementById("tabelaResultados");
  const graficoCanvas = document.getElementById("graficoProducao");
  const mensagem = document.getElementById("mensagem");
  const resultado = document.getElementById("resultado");

  let grafico = null;

  btnPesquisar.addEventListener("click", async () => {

    const usuario_id = document.getElementById("usuario_id").value;
    const data_inicial = document.getElementById("data_inicio").value;
    const data_final = document.getElementById("data_fim").value;

    if (!usuario_id) {
      mensagem.textContent = "Informe o usuário.";
      mensagem.className = "mb-4 p-4 bg-yellow-100 text-yellow-800";
      mensagem.classList.remove("hidden");
      resultado.classList.add("hidden");
      return;
    }

    const formData = new FormData();
    formData.append("usuario_id", usuario_id);
    formData.append("data_inicial", data_inicial);
    formData.append("data_final", data_final);

    const resp = await fetch("/consultar_producao_dados", {
      method: "POST",
      body: formData
    });

    const data = await resp.json();

    mensagem.classList.add("hidden");
    resultado.classList.add("hidden");

    if (!data.dados || data.dados.length === 0) {
      mensagem.textContent = "Nenhum resultado encontrado.";
      mensagem.className = "mb-4 p-4 bg-yellow-100 text-yellow-800";
      mensagem.classList.remove("hidden");
      return;
    }

    /* =====================
       TABELA
    ===================== */
    tabelaResultados.innerHTML = data.dados.map(item => `
      <tr>
        <td class="p-2">${item.numero_ficha}</td>
        <td class="p-2">${item.modelo}</td>
        <td class="p-2">${item.funcao}</td>
        <td class="p-2">${item.data}</td>
        <td class="p-2 text-right">${item.quantidade}</td>
      </tr>
    `).join("");

    /* =====================


    
       GRÁFICO AGRUPADO
       Modelo (X) | Quantidade (Y) | Cor = Função
    ===================== */

    // Modelos únicos
    const modelos = [...new Set(data.dados.map(d => d.modelo))];

    // Funções únicas
    const funcoes = [...new Set(data.dados.map(d => d.funcao))];

    // Cores fixas por função
    const cores = {
      "CONTAGEM": "#2563eb",
      "REFORÇADOR": "#7c3aed",
      "PASSA VIES": "#16a34a",
      "PASSAR VIES": "#ea580c"
    };

    const datasets = funcoes.map(funcao => ({
      label: funcao,
      backgroundColor: cores[funcao] || "#6b7280",
      data: modelos.map(modelo => {
        const registro = data.dados.find(
          d => d.modelo === modelo && d.funcao === funcao
        );
        return registro ? registro.quantidade : 0;
      })
    }));

    resultado.classList.remove("hidden");

    if (grafico) grafico.destroy();

    grafico = new Chart(graficoCanvas, {
      type: "bar",
      data: {
        labels: modelos,
        datasets: datasets
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: "right"
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              precision: 0
            }
          }
        }
      }
    });

  });

});
</script>
{% endblock %}
