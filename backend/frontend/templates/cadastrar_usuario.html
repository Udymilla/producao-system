{% extends "base.html" %}
{% block title %}Cadastro de Usuário - Sistema Dadalto{% endblock %}
{% block page_title %}Cadastro de Usuários{% endblock %}
{% set back_url = '/administracao' %}
{% block content %}
<h1 class="text-3xl font-bold text-blue-600 dark:text-blue-400 mb-6 text-center">
    Cadastro de Usuários
</h1>

{% if mensagem %}
<div class="mb-4 p-4 bg-green-100 dark:bg-green-800 text-green-700 dark:text-green-200 rounded text-center">
    {{ mensagem | safe }}
</div>
{% endif %}

<form method="post" action="/cadastrar_usuario" class="space-y-6 max-w-md mx-auto">
    <div>
        <label for="nome" class="block font-semibold mb-2">Nome do Usuário:</label>
        <input type="text" id="nome" name="nome" required
               class="w-full p-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
    </div>

    <div>
        <label for="senha" class="block font-semibold mb-2">Senha:</label>
        <input type="password" id="senha" name="senha" required
               class="w-full p-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
    </div>

    <div>
        <label for="perfil" class="block font-semibold mb-2">Perfil:</label>
        <select id="perfil" name="perfil" required
                class="w-full p-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
            <option value="">Selecione um perfil</option>
            <option value="admin">Administrador</option>
            <option value="operador">Operador</option>
        </select>
    </div>

    <div class="flex justify-center">
        <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded shadow transition">
            💾 Cadastrar Usuário
        </button>
    </div>
</form>

{% endblock %}
